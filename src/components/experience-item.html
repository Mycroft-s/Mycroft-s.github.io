<div class="qualification__data qualification__data--{{ text:side }}">
  <div class="qualification__marker">
    {{ html:badgeHtml }}
    {{ html:lineHtml }}
  </div>
  <div class="qualification__entry">
    <h3 class="qualification__title" i18n="{{ text:titleKey }}">{{ i18n:titleKey }}</h3>
    <span class="qualification__subtitle" i18n="{{ text:subtitleKey }}">{{ i18n:subtitleKey }}</span>
    <div class="qualification__calendar">
      <i class="uil uil-calendar-alt" aria-hidden="true"></i>
      <span i18n="{{ text:dateKey }}">{{ i18n:dateKey }}</span>
    </div>
  </div>
</div>
