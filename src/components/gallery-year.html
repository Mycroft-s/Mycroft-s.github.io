<section class="gallery-year" data-year="{{ text:year }}" aria-labelledby="gallery-year-{{ text:year }}">
  <header class="gallery-year__heading">
    <h2 id="gallery-year-{{ text:year }}">{{ text:year }}<span aria-hidden="true">.</span></h2>
    <p><span data-year-count>{{ text:count }}</span> <span i18n="gallery__photos">{{ t:gallery__photos }}</span></p>
  </header>
  <div class="gallery-year__groups">{{ html:cardsHtml }}</div>
</section>
