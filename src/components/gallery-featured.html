<figure class="gallery-featured__item">
  <a class="gallery-featured__link" href="{{ text:preview }}" data-gallery-open data-photo-id="{{ text:id }}">
    <img src="{{ text:preview }}" alt="{{ text:altEn }}" width="{{ text:width }}" height="{{ text:height }}" decoding="async" />
    <span class="gallery-featured__open"><span i18n="gallery__open">{{ t:gallery__open }}</span><span aria-hidden="true">↗</span></span>
  </a>
  <figcaption><span data-en="{{ text:descriptionEn }}" data-cn="{{ text:descriptionCn }}">{{ text:descriptionEn }}</span><span>{{ text:year }}</span></figcaption>
</figure>
