<section class="publication section" id="publication">
  <h2 class="section__title" i18n="publication__title">{{ t:publication__title }}</h2>
  <span class="section__subtitle" i18n="publication__subtitle"
    >{{ t:publication__subtitle }}</span>

  <div class="portfolio__container container swiper-container">
    <div class="swiper-wrapper">
      <!--==================== publication 1 ====================-->

      {{ each:publications:components/project-card.html }}
    </div>
    <!-- add arrows-->
    <div class="swiper-button-next">
      <i class="uil uil-angle-right-b swiper-portfolio-icon"></i>
    </div>

    <div class="swiper-button-prev">
      <i class="uil uil-angle-left-b swiper-portfolio-icon"></i>
    </div>

    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
  </div>
</section>
