<section class="news section" id="news">
  <h2 class="section__title" i18n="news__title">{{ t:news__title }}</h2>
  <span class="section__subtitle" i18n="news__subtitle">{{ t:news__subtitle }}</span>

  <div class="news__container container">
    <div class="news__content">
      <ul class="news__list">
        {{ each:news-recent:components/news-item.html }}
      </ul>
      <details class="news__archive">
        <summary class="news__toggle">
          <span class="news__show-more" i18n="news__show_more">{{ t:news__show_more }}</span>
          <span class="news__show-less" i18n="news__show_less">{{ t:news__show_less }}</span>
          <i class="uil uil-angle-down" aria-hidden="true"></i>
        </summary>
        <ul class="news__list news__archive-list">
          {{ each:news-archive:components/news-item.html }}
        </ul>
      </details>
    </div>
  </div>
</section>
