<section class="home section" id="home">
  <div class="home__container container grid">
    <div class="home__content grid">
      <div class="home__social">
        {{ each:social:components/home-social.html }}
      </div>

      <div class="home__img">
        <svg
          class="home__blob"
          viewBox="0 0 200 187"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
        >
          <mask id="mask0" mask-type="alpha">
            <path
              d="M190.312 36.4879C206.582 62.1187 201.309 102.826 182.328 134.186C163.346 165.547
                          130.807 187.559 100.226 186.353C69.6454 185.297 41.0228 161.023 21.7403 129.362C2.45775
                          97.8511 -7.48481 59.1033 6.67581 34.5279C20.9871 10.1032 59.7028 -0.149132 97.9666
                          0.00163737C136.23 0.303176 174.193 10.857 190.312 36.4879Z"
            />
          </mask>
          <g mask="url(#mask0)">
            <path
              d="M190.312 36.4879C206.582 62.1187 201.309 102.826 182.328 134.186C163.346
                          165.547 130.807 187.559 100.226 186.353C69.6454 185.297 41.0228 161.023 21.7403
                          129.362C2.45775 97.8511 -7.48481 59.1033 6.67581 34.5279C20.9871 10.1032 59.7028
                          -0.149132 97.9666 0.00163737C136.23 0.303176 174.193 10.857 190.312 36.4879Z"
            />
            <image
              class="home__blob-img"
              x="0"
              y="-30"
              xlink:href="assets/img/cat.png"
            />
          </g>
        </svg>
      </div>

      <div class="home__data">
        <h1 class="home__title" i18n="home__title">{{ t:home__title }}</h1>
        <h3 class="home__subtitle" i18n="home__subtitle">{{ t:home__subtitle }}</h3>
        <p class="home__description" i18n="home__description">{{ t:home__description }}</p>
        <div class="home__actions">
          <a href="#contact" class="button button--flex">
            <span i18n="home__contact">{{ t:home__contact }}</span>
            <i class="uil uil-message button__icon" aria-hidden="true"></i>
          </a>
          <a href="#portfolio" class="home__selected project-link">
            <span i18n="project__home_selected">{{ t:project__home_selected }}</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </div>
    <div class="home__scroll">
      <a href="#about" class="home__scroll-button button--flex">
        <i class="uil uil-mouse-alt-2 home__scroll-mouse"></i>
        <span class="home__scroll-name" i18n="home__scroll-name"
          >{{ t:home__scroll-name }}</span>
        <i class="uil uil-arrow-down home__scroll-arrow"></i>
      </a>
    </div>
  </div>
</section>
