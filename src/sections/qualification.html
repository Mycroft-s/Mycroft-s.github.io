<section class="qualification section" id="qualification">
  <h2 class="section__title" id="qualification-heading" i18n="qualification__title">{{ t:qualification__title }}</h2>
  <span class="section__subtitle" i18n="qualification__subtitle">{{ t:qualification__subtitle }}</span>
  <div class="qualification__container container">
    <div class="qualification__tabs" role="tablist" aria-labelledby="qualification-heading">
      <button type="button" class="qualification__button button--flex qualification__active" data-target="#work" role="tab" id="tab-work" aria-controls="work" aria-selected="true" tabindex="0">
        <i class="uil uil-briefcase-alt qualification__icon" aria-hidden="true"></i>
        <span i18n="work">{{ t:work }}</span>
      </button>
      <button type="button" class="qualification__button button--flex" data-target="#education" role="tab" id="tab-education" aria-controls="education" aria-selected="false" tabindex="-1">
        <i class="uil uil-graduation-cap qualification__icon" aria-hidden="true"></i>
        <span i18n="education">{{ t:education }}</span>
      </button>
    </div>
    <div class="qualification__sections">
      <div class="qualification__content qualification__active" data-content id="work" role="tabpanel" aria-labelledby="tab-work">
        {{ each:experience-work:components/experience-item.html }}
      </div>
      <div class="qualification__content" data-content id="education" role="tabpanel" aria-labelledby="tab-education" hidden>
        {{ each:experience-education:components/experience-item.html }}
      </div>
    </div>
  </div>
</section>
