<header class="header scroll-header" id="header">
  <nav class="nav container">
    <a href="#home" class="nav__logo">Mycroft</a>

    <div class="nav__menu" id="nav-menu">
      <ul class="nav__list grid">
        <li class="nav__item">
          <a href="#about" class="nav__link">
            <i class="uil uil-user nav__icon"></i>
            <p i18n="about">{{ t:about }}</p>
          </a>
        </li>
        <li class="nav__item">
          <a href="#news" class="nav__link">
            <i class="uil uil-newspaper nav__icon"></i>
            <p i18n="news_menu">{{ t:news_menu }}</p>
          </a>
        </li>
        <li class="nav__item">
          <a href="#skills" class="nav__link">
            <i class="uil uil-file-alt nav__icon"></i>
            <p i18n="skills">{{ t:skills }}</p>
          </a>
        </li>
        <li class="nav__item">
          <a href="#qualification" class="nav__link">
            <i class="uil uil-briefcase nav__icon"></i>
            <p i18n="experience">{{ t:experience }}</p>
          </a>
        </li>
        <li class="nav__item">
          <a href="#portfolio" class="nav__link">
            <i class="uil uil-scenery nav__icon"></i>
            <p i18n="portfolio">{{ t:portfolio }}</p>
          </a>
        </li>

        <li class="nav__item">
          <a href="#publication" class="nav__link">
            <i class="uil uil-scenery nav__icon"></i>
            <p i18n="publication">{{ t:publication }}</p>
          </a>
        </li>

        <li class="nav__item">
          <a href="photography.html" class="nav__link">
            <!-- 可使用任何合适的图标，这里示例用了摄影图标 -->
            <i class="uil uil-camera nav__icon"></i>
            <p i18n="photography">{{ t:photography }}</p>
          </a>
        </li>

        <li class="nav__item">
          <a href="#contact" class="nav__link">
            <i class="uil uil-message nav__icon"></i>
            <p i18n="contact">{{ t:contact }}</p>
          </a>
        </li>
        <li class="nav__item">
          <button class="nav__link nav__control" id="translate" type="button" value="en">
            <svg class="icon nav__icon-svg" aria-hidden="true">
              <use xlink:href="#icon-fanyi"></use>
            </svg>
            <span id="nav__translate" aria-hidden="true">En/中</span>
            <span class="control-sr-only" i18n="controls__language">{{ t:controls__language }}</span>
          </button>
        </li>
      </ul>
      <button class="nav__close nav__control" id="nav-close" type="button">
        <i class="uil uil-times" aria-hidden="true"></i>
        <span class="control-sr-only" i18n="controls__close_menu">{{ t:controls__close_menu }}</span>
      </button>
    </div>

    <div class="nav__btns">
      <button class="change-theme nav__control" id="theme-button" type="button" aria-pressed="false">
        <i class="uil uil-moon" data-theme-icon aria-hidden="true"></i>
        <span class="control-sr-only" i18n="controls__dark_mode">{{ t:controls__dark_mode }}</span>
      </button>
      <button class="nav__toggle nav__control" id="nav-toggle" type="button" aria-controls="nav-menu" aria-expanded="false">
        <i class="uil uil-apps" aria-hidden="true"></i>
        <span class="control-sr-only" i18n="controls__menu">{{ t:controls__menu }}</span>
      </button>
    </div>
  </nav>
</header>
